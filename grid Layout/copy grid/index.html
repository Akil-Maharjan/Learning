<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Icon Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f5f5f5;
            padding: 40px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .title {
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 2px;
            font-size: 2.5rem;
            color: #333;
            text-transform: uppercase;
            font-weight: 300;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 60px;
            color: #666;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        
        }

        .grid-item {
            background: white;
            padding: 40px 30px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .grid-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #555;
        }

        .item-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #333;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .item-desc {
            color: #777;
            line-height: 1.6;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1rem;
                margin-bottom: 40px;
            }
            
            .grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">R E U T E P R I N T O</h1>
        <p class="subtitle">Responsive Icon Grid</p>
        
        <div class="grid">
            <div class="grid-item">
                <div class="icon">🦑</div>
                <h3 class="item-title">Squid voluptate</h3>
                <p class="item-desc">Mixtape lo-fi DISCOME</p>
            </div>
            
            <div class="grid-item">
                <div class="icon">🧥</div>
                <h3 class="item-title">Cosby sweater</h3>
                <p class="item-desc">Commodo Bitters kitsch</p>
            </div>
            
            <div class="grid-item">
                <div class="icon">🤠</div>
                <h3 class="item-title">Austin proldent</h3>
                <p class="item-desc">Mixtape lo-fi DISCOME</p>
            </div>
            
            <div class="grid-item">
                <div class="icon">📼</div>
                <h3 class="item-title">Mixtape lo-fi</h3>
                <p class="item-desc">Commodo Bitters kitsch</p>
            </div>
        </div>
    </div>
</body>
</html>
