<!DOCTYPE html>
<html lang="en">

<body>
    <header>
        <div class="logo">
            <img src="../assets/images/jnitin.png" alt="logo">

        <nav>

                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>

                <li><a href="#">Catalogues</a></li>

                <div class="social-links">
                    <a href="#"><i class="fa-brands fa-facebook-f"></i><sup>Share</sup></a>
